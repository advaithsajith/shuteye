<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="shim.js"></script><script src="../extension/shared.js"></script><script src="../extension/content.js"></script>
<style>body{font:14px system-ui;background:#fff;color:#222;margin:10px}img{width:60px;height:40px}</style></head>
<body><p id="ftext">Frame text on white. <a href="#">A link</a></p><img id="fimg" alt="">
<script>
var c=document.createElement('canvas');c.width=60;c.height=40;var x=c.getContext('2d');
for(var i=0;i<60;i++){x.fillStyle='hsl('+(i*6)+',80%,50%)';x.fillRect(i,0,1,40);}
document.getElementById('fimg').src=c.toDataURL();
</script></body></html>
