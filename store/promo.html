<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Store promo image</title>
<!-- Promo tiles for the store. Open as store/promo.html?size=small (440x280) or ?size=marquee (1400x560). -->
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,500;1,900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; }
  body { width: 440px; height: 280px; background: #2c4be3; color: #f3ead9; font-family: "Azeret Mono", ui-monospace, Consolas, monospace; position: relative; }
  body.marquee { width: 1400px; height: 560px; }
  .blob { position: absolute; border-radius: 58% 42% 55% 45% / 46% 60% 40% 54%; opacity: .6; }
  .a { width: 60%; height: 90%; left: -22%; top: 30%; background: #ff6b9d; }
  .b { width: 45%; height: 80%; right: -14%; top: -30%; background: #2fd3b8; }
  .sun { position: absolute; width: 16%; aspect-ratio: 1; right: 9%; top: 12%; border-radius: 50%; background: #ffd76a; border: 3px solid #141a4a; }
  .in { position: absolute; left: 7%; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .row { display: flex; align-items: center; gap: 14px; }
  .mark { width: 92px; height: 79px; }
  body.marquee .mark { width: 220px; height: 189px; }
  h1 { margin: 0; font-size: 50px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; text-shadow: 3px 3px 0 #141a4a; }
  body.marquee h1 { font-size: 150px; text-shadow: 6px 6px 0 #141a4a; }
  p { margin: 10px 0 0; font-size: 17px; font-weight: 500; }
  body.marquee p { font-size: 42px; margin-top: 22px; }
  .fox { width: 100%; height: 100%; overflow: visible; }
  .fox-fur { fill: #ff8a3d; stroke: #141a4a; stroke-width: 1.4; stroke-linejoin: round; } .fox-ear { fill: #141a4a; opacity: .4; } .fox-cheek { fill: #f3ead9; } .fox-nose { fill: #141a4a; }
  .fox-eye { display: none; } .fox-lid { fill: none; stroke: #141a4a; stroke-width: 1.9; stroke-linecap: round; }
  .fox-z { fill: none; stroke: #f3ead9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
<div class="blob a"></div><div class="blob b"></div><div class="sun"></div>
<div class="in"><div class="row"><span class="mark" id="mark"></span><h1>ShutEye</h1></div><p>Lights out for every website</p></div>
<script src="../extension/shared.js"></script>
<script>
  if (new URLSearchParams(location.search).get('size') === 'marquee') document.body.className = 'marquee';
  document.getElementById('mark').innerHTML = ShutEye.foxSvg();
</script>
</body></html>
